<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Troubleshooting Solution</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }

        .query {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
            color: #444;
        }

        .solution {
            background: #f1f3f5;
            padding: 20px;
            border-radius: 8px;
            color: #444;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Troubleshooting Solution</h1>

        <div class="section">
            <h2>Your Query</h2>

            <div class="query">
                {{ query }}
            </div>
        </div>

        <div class="section">
            <h2>Solution</h2>

            <div class="solution">
                {{ result }}
            </div>
        </div>

        <div class="button-container">
            <a href="/chat" class="button">
                Ask Another Question
            </a>
        </div>

    </div>

</body>
</html>
