
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket Created</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fa;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .success {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
            color: #222;
        }

        .message {
            color: #666;
            margin-bottom: 25px;
        }

        .ticket-box {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }

        .ticket-box p {
            margin: 8px 0;
        }

        .ticket-id {
            font-weight: bold;
            color: #333;
        }

        .query {
            color: #555;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="success">✓</div>

        <h1>Ticket Created Successfully!</h1>

        <p class="message">
            Your support ticket has been created successfully.
        </p>

        <div class="ticket-box">

            <p>
                <strong>Ticket ID:</strong>
                <span class="ticket-id">{{ ticket_id }}</span>
            </p>

            <p>
                <strong>Issue:</strong>
                <span class="query">{{ query }}</span>
            </p>

        </div>

        <a href="/chat" class="button">
            Back to Chat
        </a>

    </div>

</body>
</html>
