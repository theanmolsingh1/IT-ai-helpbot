
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Helpdesk Response</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fa;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .response {
            background: #f1f3f5;
            padding: 20px;
            border-radius: 8px;
            color: #444;
            line-height: 1.6;
            margin-bottom: 25px;
            white-space: pre-wrap;
        }

        .button-container {
            text-align: center;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Helpdesk</h1>

        <div class="response">
            {{ response }}
        </div>

        <div class="button-container">
            <a href="/chat" class="button">
                Back to Chat
            </a>
        </div>

    </div>

</body>
</html>
